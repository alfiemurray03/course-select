<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Sousa Murray eLearning helps individuals and organisations choose online training from trusted course providers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Sousa Murray eLearning | Online learning from trusted providers</title>
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('aptenvo-theme') || 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var useDark = preference === 'dark' || (preference === 'system' && systemDark);
          document.documentElement.classList.toggle('dark', useDark);
          document.documentElement.style.colorScheme = useDark ? 'dark' : 'light';
        } catch (_) {
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <main id="app-loading" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
        <section style="max-width:560px;text-align:center">
          <strong style="display:block;font-size:1.4rem;margin-bottom:8px">Sousa Murray eLearning</strong>
          <p style="margin:0;color:#475569">Loading the learning website…</p>
        </section>
      </main>
    </div>
    <script>
      (function () {
        function showStartupError() {
          var loading = document.getElementById('app-loading');
          if (!loading) return;
          loading.innerHTML =
            '<section style="max-width:560px;text-align:center">' +
            '<strong style="display:block;font-size:1.4rem;margin-bottom:8px">Sousa Murray eLearning</strong>' +
            '<h1 style="font-size:1.25rem;margin:0 0 10px">The website did not finish loading.</h1>' +
            '<p style="margin:0 0 18px;color:#475569">Please reload this page. No payment or account information has been submitted.</p>' +
            '<button type="button" onclick="window.location.reload()" style="border:0;border-radius:10px;background:#2563eb;color:white;padding:11px 18px;font-weight:700;cursor:pointer">Reload website</button>' +
            '</section>';
        }

        window.setTimeout(showStartupError, 8000);
        window.addEventListener('error', function () {
          window.setTimeout(showStartupError, 0);
        }, true);
        window.addEventListener('unhandledrejection', function () {
          window.setTimeout(showStartupError, 0);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx?v=20260805-hotfix1"></script>
  </body>
</html>
