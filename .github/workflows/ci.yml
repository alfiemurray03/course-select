name: Aptenvo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check Aptenvo
        run: npm run check
      - name: Build Aptenvo website
        run: npm run build
      - name: Build Cloudflare Pages Functions
        run: |
          mkdir -p .wrangler
          npx --yes wrangler@4.114.0 pages functions build functions --outfile=.wrangler/functions-worker.js

      - name: Check live Central Payments Stripe account
        shell: bash
        run: |
          set -uo pipefail
          url='https://sousamurrayelearning.jagroupservices.co.uk/api/catalogue/central-stripe-account'
          for attempt in $(seq 1 12); do
            status=$(curl --max-time 12 --connect-timeout 5 --silent --show-error \
              --output /tmp/central-stripe-account.json \
              --write-out '%{http_code}' "$url")
            curl_exit=$?
            echo "attempt=${attempt} curl_exit=${curl_exit} http_status=${status:-000}"
            cat /tmp/central-stripe-account.json 2>/dev/null || true
            echo
            if [ "$curl_exit" -eq 0 ] && [ "$status" = '200' ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Diagnose one live Stripe catalogue product sync
        shell: bash
        run: |
          set -uo pipefail
          url='https://sousamurrayelearning.jagroupservices.co.uk/api/catalogue/stripe-sync?family=sousa_murray&offset=0&limit=1&force=1'
          echo "Requesting one production Sousa Murray course product..."
          status=$(curl --max-time 20 --connect-timeout 5 --silent --show-error \
            --output /tmp/catalogue-diagnostic.json \
            --write-out '%{http_code}' "$url")
          curl_exit=$?
          echo "curl_exit=${curl_exit} http_status=${status:-000}"
          echo '--- response body ---'
          cat /tmp/catalogue-diagnostic.json 2>/dev/null || true
          echo
          echo '--- end response body ---'
          if [ "$curl_exit" -ne 0 ] || [ "$status" != '200' ]; then
            exit 1
          fi
