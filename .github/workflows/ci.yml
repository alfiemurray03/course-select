name: Aptenvo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check Aptenvo
        run: npm run check
      - name: Build Aptenvo website
        run: npm run build
      - name: Build Cloudflare Pages Functions
        run: |
          mkdir -p .wrangler
          npx --yes wrangler@4.114.0 pages functions build functions --outfile=.wrangler/functions-worker.js
