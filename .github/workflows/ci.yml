name: Aptenvo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check Aptenvo
        run: npm run check
      - name: Build Aptenvo website
        run: npm run build
      - name: Build Cloudflare Pages Functions
        run: |
          mkdir -p .wrangler
          npx --yes wrangler@4.114.0 pages functions build functions --outfile=.wrangler/functions-worker.js

      - name: Verify live JA Group Services Central Payments Stripe account
        shell: bash
        run: |
          set -euo pipefail
          url='https://sousamurrayelearning.jagroupservices.co.uk/api/catalogue/central-stripe-account'
          body_file='/tmp/central-stripe-account.json'
          status=$(curl --max-time 15 --connect-timeout 5 --silent --show-error --output "$body_file" --write-out '%{http_code}' "$url")
          cat "$body_file"
          echo
          test "$status" = '200'
          test "$(jq -r '.stripeAccountId // ""' "$body_file")" = 'acct_1TD5VrDRkfgIdp5x'
          test "$(jq -r '.liveMode // false' "$body_file")" = 'true'
          echo 'Verified JA Group Services Central Payments live Stripe account.'

      - name: Synchronise every Sousa Murray and Highfield course product
        shell: bash
        run: |
          set -euo pipefail
          base='https://sousamurrayelearning.jagroupservices.co.uk/api/catalogue/stripe-sync'

          sync_family() {
            family="$1"
            offset=0
            processed=0
            created_products=0
            existing_products=0
            created_prices=0
            replaced_prices=0
            pending_prices=0
            total='unknown'

            while true; do
              url="${base}?family=${family}&offset=${offset}&limit=1"
              body_file="/tmp/catalogue-${family}-${offset}.json"

              status=$(curl --max-time 25 --connect-timeout 5 --silent --show-error \
                --retry 2 --retry-delay 2 --retry-all-errors \
                --output "$body_file" --write-out '%{http_code}' "$url" || true)

              if [ "$status" != '200' ]; then
                echo "${family} offset ${offset} failed with HTTP ${status:-000}" >&2
                cat "$body_file" 2>/dev/null || true
                exit 1
              fi

              body=$(cat "$body_file")
              synced=$(echo "$body" | jq -r '.synced // 0')
              batch_created_products=$(echo "$body" | jq -r '.createdProducts // 0')
              batch_existing_products=$(echo "$body" | jq -r '.existingProducts // 0')
              batch_created_prices=$(echo "$body" | jq -r '.createdPrices // 0')
              batch_replaced_prices=$(echo "$body" | jq -r '.replacedPrices // 0')
              batch_pending_prices=$(echo "$body" | jq -r '.pendingPrices // 0')
              total=$(echo "$body" | jq -r '.total // "unknown"')

              processed=$((processed + synced))
              created_products=$((created_products + batch_created_products))
              existing_products=$((existing_products + batch_existing_products))
              created_prices=$((created_prices + batch_created_prices))
              replaced_prices=$((replaced_prices + batch_replaced_prices))
              pending_prices=$((pending_prices + batch_pending_prices))

              if [ $((processed % 10)) -eq 0 ] || [ "$processed" = "$total" ]; then
                echo "${family}: ${processed}/${total} products reconciled; created=${created_products}; existing=${existing_products}; prices_created=${created_prices}; prices_replaced=${replaced_prices}; prices_pending=${pending_prices}"
              fi

              next=$(echo "$body" | jq -r 'if .nextOffset == null then "" else (.nextOffset|tostring) end')
              if [ -z "$next" ]; then
                break
              fi
              offset="$next"
            done

            echo "COMPLETE ${family}: total=${processed}/${total}; created_products=${created_products}; existing_products=${existing_products}; created_prices=${created_prices}; replaced_prices=${replaced_prices}; pending_prices=${pending_prices}"
          }

          sync_family 'sousa_murray'
          sync_family 'highfield'
